
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Add Follow Up</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        form { width: 300px; }
        label { display: block; margin-top: 10px; }
        input, select, textarea { width: 100%; padding: 5px; margin-top: 5px; }
        button { margin-top: 15px; padding: 10px; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>Add Follow Up</h1>
<div class="menu">
    <a href="/followups">Back to List</a>
</div>

<form action="/followups" method="post" th:object="${followUp}">
    <label>Employee</label>
    <select th:field="*{employee}">
        <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
    </select>

    <label>Date</label>
    <input type="date" th:field="*{date}" required />

    <label>Topic</label>
    <textarea th:field="*{topic}" required></textarea>

    <label>Status</label>
    <select th:field="*{status}">
        <option value="PENDING">Pending</option>
        <option value="DONE">Done</option>
    </select>

    <button type="submit">Save</button>
</form>

</body>
</html>
