
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Role Ratings</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>Role Ratings</h1>
<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/ratings/new">Add Rating</a>
</div>

<table>
    <thead>
    <tr>
        <th>Employee</th>
        <th>Criteria</th>
        <th>Score</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="rating : ${ratings}">
        <td th:text="${rating.employee != null} ? ${rating.employee.name} : 'Unknown'"></td>
        <td th:text="${rating.criteria}"></td>
        <td th:text="${rating.score}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
