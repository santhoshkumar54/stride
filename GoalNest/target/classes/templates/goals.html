
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Goals</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>Goals</h1>
<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/goals/new">Add Goal</a>
</div>

<table>
    <thead>
    <tr>
        <th>Employee</th>
        <th>Description</th>
        <th>Deadline</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="goal : ${goals}">
        <td th:text="${goal.employee != null} ? ${goal.employee.name} : 'Unknown'"></td>
        <td th:text="${goal.description}"></td>
        <td th:text="${goal.deadline}"></td>
        <td th:text="${goal.status}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
