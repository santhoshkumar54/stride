
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Follow Ups</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>Follow Ups</h1>
<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/followups/new">Add Follow Up</a>
</div>

<table>
    <thead>
    <tr>
        <th>Employee</th>
        <th>Date</th>
        <th>Topic</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="fu : ${followUps}">
        <td th:text="${fu.employee != null} ? ${fu.employee.name} : 'Unknown'"></td>
        <td th:text="${fu.date}"></td>
        <td th:text="${fu.topic}"></td>
        <td th:text="${fu.status}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
