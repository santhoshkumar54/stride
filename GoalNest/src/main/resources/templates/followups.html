<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/followups/new}" class="btn-primary">+ Add Follow Up</a>
        </span>
    </div>

    <h1>Follow Ups</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Topic</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="fu : ${followUps}">
            <td th:text="${fu.employee != null} ? ${fu.employee.name} : 'Unknown'"></td>
            <td th:text="${fu.date}"></td>
            <td th:text="${fu.topic}"></td>
            <td>
                <span th:text="${fu.status}"
                      th:style="${fu.status == 'DONE'} ? 'color: var(--success-color); font-weight: bold;' :
                               (${fu.status == 'PENDING'} ? 'color: var(--danger-color); font-weight: bold;' : 'color: var(--text-light);')">
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
