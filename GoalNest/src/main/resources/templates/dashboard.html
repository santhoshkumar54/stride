
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>GoalNest Dashboard</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        .card { padding: 20px; border: 1px solid #ddd; margin-bottom: 15px; border-radius: 8px; display: inline-block; width: 200px; margin-right: 15px; vertical-align: top;}
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
        .user-info { float: right; }
    </style>
</head>
<body>
<div class="user-info">
    Logged in as: <span sec:authentication="name">User</span>
    <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit">Logout</button>
    </form>
</div>

<h1>GoalNest</h1>
<p>Your lightweight manager cockpit</p>

<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/employees">Employees</a>
    <a href="/leaves">Leaves</a>
    <a href="/goals">Goals</a>
    <a href="/followups">Follow Ups</a>
    <a href="/points">Points</a>
    <a href="/talkingpoints">1:1 Talking Points</a>
    <a href="/ratings">Role Ratings</a>
</div>

<div class="card">
    <h3>Leaves</h3>
    <p>Pending: <b th:text="${leaves}"></b></p>
    <a href="/leaves">Manage</a>
</div>
<div class="card">
    <h3>Goals</h3>
    <p>Active: <b th:text="${goals}"></b></p>
    <a href="/goals">Manage</a>
</div>
<div class="card">
    <h3>Follow Ups</h3>
    <p>Pending: <b th:text="${followups}"></b></p>
    <a href="/followups">Manage</a>
</div>

</body>
</html>
