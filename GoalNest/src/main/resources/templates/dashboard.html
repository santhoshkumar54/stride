<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>GoalNest Dashboard</h1>
    <p style="margin-bottom: 30px; color: var(--text-light);">Your lightweight manager cockpit</p>

    <div class="card-container">
        <div class="card">
            <h3>Employees</h3>
            <div class="card-stat">-</div>
            <p>Team Members</p>
            <a th:href="@{/employees}" class="card-action">View Team &rarr;</a>
        </div>
        <div class="card">
            <h3>Teams</h3>
            <div class="card-stat">-</div>
            <p>Manage Teams</p>
            <a th:href="@{/teams}" class="card-action">View Teams &rarr;</a>
        </div>
    </div>
</body>
</html>
