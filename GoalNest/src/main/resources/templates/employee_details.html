<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/employees}" class="btn-secondary">&larr; Back to Employees</a>
    </div>

    <h1 th:text="${employee.name}">Employee Name</h1>

    <div style="margin-bottom: 20px; background: #f9f9f9; padding: 20px; border-radius: 5px;">
        <h3>Details</h3>
        <p><strong>Role:</strong> <span th:text="${employee.role}"></span></p>
        <p><strong>Email:</strong> <span th:text="${employee.email}"></span></p>
        <p><strong>Job Level:</strong> <span th:text="${employee.jobLevel}"></span></p>
        <p><strong>Type:</strong> <span th:text="${employee.employeeType}"></span></p>
        <p><strong>Github:</strong> <span th:text="${employee.githubUsername}"></span></p>
    </div>

    <h3>Team History</h3>
    <table>
        <thead>
        <tr>
            <th>Team</th>
            <th>Role in Team</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Duration</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="mem : ${history}">
            <td th:text="${mem.team.name}"></td>
            <td th:text="${mem.roleInTeam}"></td>
            <td th:text="${mem.startDate}"></td>
            <td th:text="${mem.endDate != null} ? ${mem.endDate} : 'Current'"></td>
            <td th:text="${mem.duration}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(history)}">
            <td colspan="5" style="text-align:center;">No team history found.</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
