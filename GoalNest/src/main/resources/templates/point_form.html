<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Add Performance Points</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/points}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/points}" method="post" th:object="${performancePoint}">
        <label>Employee</label>
        <select th:field="*{employee}">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
        </select>

        <label>Date</label>
        <input type="date" th:field="*{date}" required />

        <label>Points</label>
        <input type="number" th:field="*{points}" required placeholder="e.g. 5 or -2"/>

        <label>Reason</label>
        <textarea th:field="*{reason}" rows="3" placeholder="Reason for points..."></textarea>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Points</button>
        </div>
    </form>
</body>
</html>
