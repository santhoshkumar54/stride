<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/leaves/new}" class="btn-primary">+ Request Leave</a>
        </span>
    </div>

    <h1>Leave Requests</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reason</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leave : ${leaveRequests}">
            <td th:text="${leave.employee != null} ? ${leave.employee.name} : 'Unknown'"></td>
            <td th:text="${leave.startDate}"></td>
            <td th:text="${leave.endDate}"></td>
            <td th:text="${leave.reason}"></td>
            <td>
                <span th:text="${leave.status}"
                      th:style="${leave.status == 'APPROVED'} ? 'color: var(--success-color); font-weight: bold;' :
                               (${leave.status == 'REJECTED'} ? 'color: var(--danger-color); font-weight: bold;' : 'color: var(--accent-color); font-weight: bold;')">
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
