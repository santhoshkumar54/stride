
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Leaves</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>Leave Requests</h1>
<div class="menu">
    <a href="/">Dashboard</a>
    <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
        <a href="/leaves/new">Request Leave</a>
    </span>
</div>

<table>
    <thead>
    <tr>
        <th>Employee</th>
        <th>Start Date</th>
        <th>End Date</th>
        <th>Reason</th>
        <th>Status</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="leave : ${leaveRequests}">
        <td th:text="${leave.employee != null} ? ${leave.employee.name} : 'Unknown'"></td>
        <td th:text="${leave.startDate}"></td>
        <td th:text="${leave.endDate}"></td>
        <td th:text="${leave.reason}"></td>
        <td th:text="${leave.status}"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
