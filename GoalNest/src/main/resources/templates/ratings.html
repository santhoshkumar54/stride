<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/ratings/new}" class="btn-primary">+ Add Rating</a>
        </span>
    </div>

    <h1>Role Ratings</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Criteria</th>
            <th>Score</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="rating : ${ratings}">
            <td th:text="${rating.employee != null} ? ${rating.employee.name} : 'Unknown'"></td>
            <td th:text="${rating.criteria}"></td>
            <td>
                <span th:text="${rating.score}"
                      th:style="${rating.score >= 4} ? 'color: var(--success-color); font-weight: bold;' :
                               (${rating.score < 3} ? 'color: var(--danger-color); font-weight: bold;' : 'color: var(--text-color); font-weight: bold;')">
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
