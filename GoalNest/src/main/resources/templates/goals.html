<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/goals/new}" class="btn-primary">+ Add Goal</a>
        </span>
    </div>

    <h1>Goals</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Description</th>
            <th>Deadline</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="goal : ${goals}">
            <td th:text="${goal.employee != null} ? ${goal.employee.name} : 'Unknown'"></td>
            <td th:text="${goal.description}"></td>
            <td th:text="${goal.deadline}"></td>
            <td>
                <span th:text="${goal.status}"
                      th:style="${goal.status == 'COMPLETED'} ? 'color: var(--success-color); font-weight: bold;' :
                               (${goal.status == 'IN_PROGRESS'} ? 'color: var(--accent-color); font-weight: bold;' : 'color: var(--text-light);')">
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
