<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/points/new}" class="btn-primary">+ Add Points</a>
        </span>
    </div>

    <h1>Performance Points</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Points</th>
            <th>Reason</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="pt : ${points}">
            <td th:text="${pt.employee != null} ? ${pt.employee.name} : 'Unknown'"></td>
            <td th:text="${pt.date}"></td>
            <td>
                <span th:text="${pt.points > 0 ? '+' + pt.points : pt.points}"
                      th:style="${pt.points >= 0} ? 'color: var(--success-color); font-weight: bold;' : 'color: var(--danger-color); font-weight: bold;'">
                </span>
            </td>
            <td th:text="${pt.reason}"></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
