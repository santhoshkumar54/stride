
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>1:1 Talking Points</title>
    <style>
        body { font-family: Arial; margin: 40px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .menu { margin-bottom: 20px; }
        .menu a { margin-right: 15px; text-decoration: none; color: #333; font-weight: bold; }
    </style>
</head>
<body>
<h1>1:1 Talking Points</h1>
<div class="menu">
    <a href="/">Dashboard</a>
    <a href="/talkingpoints/new">Add Talking Point</a>
</div>

<table>
    <thead>
    <tr>
        <th>Employee</th>
        <th>Date</th>
        <th>Topic</th>
        <th>Discussed?</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="tp : ${talkingPoints}">
        <td th:text="${tp.employee != null} ? ${tp.employee.name} : 'Unknown'"></td>
        <td th:text="${tp.createdDate}"></td>
        <td th:text="${tp.topic}"></td>
        <td th:text="${tp.isDiscussed} ? 'Yes' : 'No'"></td>
    </tr>
    </tbody>
</table>

</body>
</html>
