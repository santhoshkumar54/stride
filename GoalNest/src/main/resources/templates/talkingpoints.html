<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/talkingpoints/new}" class="btn-primary">+ Add Talking Point</a>
        </span>
    </div>

    <h1>1:1 Talking Points</h1>

    <table>
        <thead>
        <tr>
            <th>Employee</th>
            <th>Date</th>
            <th>Topic</th>
            <th>Discussed?</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="tp : ${talkingPoints}">
            <td th:text="${tp.employee != null} ? ${tp.employee.name} : 'Unknown'"></td>
            <td th:text="${tp.createdDate}"></td>
            <td th:text="${tp.topic}"></td>
            <td>
                <span th:text="${tp.isDiscussed} ? 'Yes' : 'No'"
                      th:style="${tp.isDiscussed} ? 'color: var(--success-color); font-weight: bold;' : 'color: var(--danger-color); font-weight: bold;'">
                </span>
            </td>
        </tr>
        </tbody>
    </table>
</body>
</html>
