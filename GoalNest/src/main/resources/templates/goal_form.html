<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Add Goal</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/goals}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/goals}" method="post" th:object="${goal}">
        <label>Employee</label>
        <select th:field="*{employee}">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
        </select>

        <label>Description</label>
        <textarea th:field="*{description}" required rows="4" placeholder="Goal details..."></textarea>

        <label>Deadline</label>
        <input type="date" th:field="*{deadline}" required />

        <label>Status</label>
        <select th:field="*{status}">
            <option value="IN_PROGRESS">In Progress</option>
            <option value="COMPLETED">Completed</option>
        </select>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Goal</button>
        </div>
    </form>
</body>
</html>
