<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <div class="actions">
        <span sec:authorize="hasAnyRole('MANAGER', 'SCRUM_MASTER')">
            <a th:href="@{/employees/new}" class="btn-primary">+ Add Employee</a>
        </span>
    </div>

    <h1>Employees</h1>

    <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Role</th>
            <th>Job Level</th>
            <th>Type</th>
            <th>Email</th>
            <th>Github</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="emp : ${employees}">
            <td>
                <a th:href="@{'/employees/' + ${emp.id}}" th:text="${emp.name}" style="color: #007bff; text-decoration: none;"></a>
            </td>
            <td th:text="${emp.role}"></td>
            <td th:text="${emp.jobLevel}"></td>
            <td th:text="${emp.employeeType}"></td>
            <td th:text="${emp.email}"></td>
            <td th:text="${emp.githubUsername}"></td>
        </tr>
        </tbody>
    </table>
</body>
</html>
