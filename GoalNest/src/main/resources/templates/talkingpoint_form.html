<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Add Talking Point</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/talkingpoints}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/talkingpoints}" method="post" th:object="${talkingPoint}">
        <label>Employee</label>
        <select th:field="*{employee}">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
        </select>

        <label>Date</label>
        <input type="date" th:field="*{createdDate}" required />

        <label>Topic</label>
        <textarea th:field="*{topic}" required rows="4"></textarea>

        <label>Discussed?</label>
        <select th:field="*{isDiscussed}">
            <option value="false">No</option>
            <option value="true">Yes</option>
        </select>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Talking Point</button>
        </div>
    </form>
</body>
</html>
