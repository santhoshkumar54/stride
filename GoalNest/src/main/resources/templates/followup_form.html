<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Add Follow Up</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/followups}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/followups}" method="post" th:object="${followUp}">
        <label>Employee</label>
        <select th:field="*{employee}">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
        </select>

        <label>Date</label>
        <input type="date" th:field="*{date}" required />

        <label>Topic</label>
        <textarea th:field="*{topic}" required rows="4"></textarea>

        <label>Status</label>
        <select th:field="*{status}">
            <option value="PENDING">Pending</option>
            <option value="DONE">Done</option>
        </select>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Follow Up</button>
        </div>
    </form>
</body>
</html>
