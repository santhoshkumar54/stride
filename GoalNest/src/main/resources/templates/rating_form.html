<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Add Role Rating</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/ratings}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/ratings}" method="post" th:object="${roleRating}">
        <label>Employee</label>
        <select th:field="*{employee}">
            <option th:each="emp : ${employees}" th:value="${emp.id}" th:text="${emp.name}"></option>
        </select>

        <label>Criteria</label>
        <input type="text" th:field="*{criteria}" required placeholder="e.g. Communication"/>

        <label>Score (1-10)</label>
        <input type="number" th:field="*{score}" min="1" max="10" required />

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Rating</button>
        </div>
    </form>
</body>
</html>
