<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="fragments/layout :: layout(~{::body})">
<body>
    <h1>Create Team</h1>
    <div style="margin-bottom: 20px;">
        <a th:href="@{/teams}" class="btn-secondary">&larr; Back to List</a>
    </div>

    <form th:action="@{/teams}" method="post" th:object="${team}">
        <label>Team Name</label>
        <input type="text" th:field="*{name}" required placeholder="e.g. Alpha Squad"/>

        <div style="margin-top: 20px;">
            <button type="submit" class="btn-primary">Save Team</button>
        </div>
    </form>
</body>
</html>
